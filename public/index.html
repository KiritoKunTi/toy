<!DOCTYPE html>
<html lang="kk">
    <head>
        <meta charset="utf-8" />
        <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
        <meta name="theme-color" content="#8097c9" />
                
        <!-- Open Graph / Facebook -->
        <meta property="og:type" content="website" />
        <!-- <meta property="og:url" content="https://oryntap.kz/" /> -->
        <meta property="og:image" content="%PUBLIC_URL%/preview.png" />

        <!-- Twitter -->
        <meta property="twitter:card" content="summary_large_image" />
        <!-- <meta property="twitter:url" content="https://oryntap.kz/" /> -->
        <meta property="twitter:image" content="%PUBLIC_URL%/preview.png" />

        <!-- <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" /> -->
        <link rel="stylesheet" href="./js/index.css" />
        
        <title>Ақсауле - Қыз ұзату</title>
        <script src="https://maps.api.2gis.ru/2.0/loader.js"></script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root" class="fade-in"></div>
        <div id="falling-flower"></div>
        <script type="text/javascript">
            var map

            DG.then(function () {
                map = DG.map("map", {
                    center: [50.275738, 57.136831],
                    zoom: 16,
                    fullscreenControl: false,
                    zoomControl: false,
                })

                var customIcon = DG.icon({
                    iconUrl: './marker-heart.svg', 
                    iconSize: [30, 30],
                    className: 'custom-marker-icon'
                })

                DG.marker([50.275773, 57.137053], {
                    icon: customIcon
                })
                .addTo(map)
                .bindPopup('Royal Palace')
            })
        </script>
        <script src="./js/sakura.js"></script>
        <script style="background-attachment: fixed">
            var sakura = new Sakura("#falling-flower", {
                fallSpeed: 0.5,
                colors: [
                    {
                        gradientColorStart: "rgba(118, 160, 225, 0.2)",
                        gradientColorEnd: "rgba(118, 160, 225, 0.2)",
                        gradientColorDegree: 120,
                    },
                    {
                        gradientColorStart: "rgba(44,  0)",
                        gradientColorEnd: "rgba(44,  0)",
                        gradientColorDegree: 120,
                    },
                    {
                        gradientColorStart: "rgba(44,  0)",
                        gradientColorEnd: "rgba(44, 0)",
                        gradientColorDegree: 120,
                    },
                ],
                delay: 40,
            })
        </script>
        <script>
            // Dispatch userInteracted event on any user interaction
            function handleFirstInteraction() {
                window.dispatchEvent(new Event('userInteracted'));
                document.removeEventListener('click', handleFirstInteraction);
                document.removeEventListener('touchstart', handleFirstInteraction);
                document.removeEventListener('keydown', handleFirstInteraction);
            }

            document.addEventListener('click', handleFirstInteraction);
            document.addEventListener('touchstart', handleFirstInteraction);
            document.addEventListener('keydown', handleFirstInteraction);
        </script>
    </body>
</html>
