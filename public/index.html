        <!-- Twitter -->
        <meta name="twitter:card" content="summary_large_image" />

        <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
        <link rel="stylesheet" href="./js/index.css" />

    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root" class="fade-in"></div>
        <div id="falling-flower"></div>
        <script src="./js/sakura.js"></script>
        <script style="background-attachment: fixed">
            var sakura = new Sakura("#falling-flower", {
                fallSpeed: 0.5,
                colors: [
                    {
                        gradientColorStart: "rgba(118, 160, 225, 0.2)",
                        gradientColorEnd: "rgba(118, 160, 225, 0.2)",
                        gradientColorDegree: 120,
                    },
                    {
                        gradientColorStart: "rgba(44,  0)",
                        gradientColorEnd: "rgba(44,  0)",
                        gradientColorDegree: 120,
                    },
                    {
                        gradientColorStart: "rgba(44,  0)",
                        gradientColorEnd: "rgba(44, 0)",
                        gradientColorDegree: 120,
                    },
                ],
                delay: 40,
            })
        </script>
        <script>
            // Dispatch userInteracted event on any user interaction
            function handleFirstInteraction() {
                window.dispatchEvent(new Event("userInteracted"))
                document.removeEventListener("click", handleFirstInteraction)
                document.removeEventListener("touchstart", handleFirstInteraction)
                document.removeEventListener("keydown", handleFirstInteraction)
            }

            document.addEventListener("click", handleFirstInteraction)
            document.addEventListener("touchstart", handleFirstInteraction)
            document.addEventListener("keydown", handleFirstInteraction)
        </script>
    </body>
</html>
